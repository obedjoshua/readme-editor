name: Update Custom Profile SVGs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render-svgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_svgs.py
      - name: Commit & Push SVGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f dist/hero-card.svg dist/now-playing.svg dist/commit-line.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m 'chore: sync profile SVGs from README' && git push)
