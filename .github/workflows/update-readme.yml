name: Update Custom Profile SVGs

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [sync-readme]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  render-svgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generate_svgs.py
      - name: Publish SVGs to svg-assets branch
        run: |
          cd svg_out
          git init
          git checkout -b svg-assets
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'chore: sync profile SVGs from README'
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" svg-assets
